<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="50%" stop-color="#FF5A36"/>
      <stop offset="100%" stop-color="#E01E5A"/>
    </linearGradient>
    <linearGradient id="bunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC875"/>
      <stop offset="100%" stop-color="#E59A35"/>
    </linearGradient>
    <linearGradient id="pattyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B3A24"/>
      <stop offset="100%" stop-color="#4A2313"/>
    </linearGradient>
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="lettuceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ED573"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="28" y="28" width="456" height="456" rx="116" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="8"/>
  
  <!-- Steam Particles -->
  <path d="M 200 130 Q 215 100 200 70" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 256 120 Q 275 90 256 60" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 312 130 Q 327 100 312 70" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Burger Icon Group -->
  <g id="burger">
    <!-- Top Bun -->
    <path d="M 140 230 C 140 160, 372 160, 372 230 C 372 242, 140 242, 140 230 Z" fill="url(#bunGrad)"/>
    
    <!-- Sesame Seeds on Bun -->
    <ellipse cx="210" cy="195" rx="8" ry="4" fill="#FFFFFF" opacity="0.9" transform="rotate(-15 210 195)"/>
    <ellipse cx="256" cy="180" rx="9" ry="4.5" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="305" cy="195" rx="8" ry="4" fill="#FFFFFF" opacity="0.9" transform="rotate(15 305 195)"/>

    <!-- Wavy Lettuce Layer -->
    <path d="M 130 242 Q 155 260 180 245 Q 205 262 230 245 Q 256 262 282 245 Q 307 262 332 245 Q 357 260 382 242 L 372 260 L 140 260 Z" fill="url(#lettuceGrad)"/>

    <!-- Melted Cheese Layer -->
    <path d="M 145 258 L 367 258 L 350 280 L 320 270 L 290 305 L 260 270 L 210 295 L 180 270 Z" fill="url(#cheeseGrad)"/>

    <!-- Patty Layer -->
    <rect x="135" y="280" width="242" height="38" rx="19" fill="url(#pattyGrad)"/>

    <!-- Tomato Slices Peak -->
    <circle cx="210" cy="256" r="16" fill="#E74C3C" opacity="0.85"/>
    <circle cx="302" cy="256" r="16" fill="#E74C3C" opacity="0.85"/>

    <!-- Bottom Bun -->
    <path d="M 145 330 C 145 330, 145 375, 195 375 L 317 375 C 367 375, 367 330, 367 330 Z" fill="url(#bunGrad)"/>
  </g>
</svg>
