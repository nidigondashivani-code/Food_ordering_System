[build]
  command = "pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput"
  functions = "netlify/functions"
  publish = "staticfiles"

[build.environment]
  PYTHON_VERSION = "3.12"

[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true
