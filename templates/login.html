{% extends 'base.html' %}

{% block title %}Login - FoodHub{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;" class="card">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 60px; height: 60px; background: var(--primary-light); color: var(--primary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 1rem;">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h1 style="font-size: 1.8rem;">Welcome Back to FoodHub</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Login to order food or manage your restaurant</p>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.9rem; margin-top: 1rem;">
            <i class="fa-solid fa-right-to-bracket"></i> Login to Account
        </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-muted); display: flex; justify-content: space-around; flex-wrap: wrap; gap: 0.5rem;">
        <a href="{% url 'register' %}" style="color: var(--primary-color); font-weight: 700;"><i class="fa-solid fa-user"></i> Customer Register</a>
        <a href="{% url 'owner_register' %}" style="color: var(--secondary-color); font-weight: 700;"><i class="fa-solid fa-store"></i> Owner Register</a>
    </div>
</div>
{% endblock %}
