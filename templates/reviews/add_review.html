{% extends 'base.html' %}

{% block title %}Write Review - Order #{{ order.order_number }}{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto;" class="card">
    <h1 style="margin-bottom: 0.5rem; text-align: center;"><i class="fa-solid fa-star" style="color: var(--secondary-color);"></i> Rate Your Order</h1>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">
        How was your meal from <strong>{{ order.restaurant.restaurant_name }}</strong>?
    </p>

    <form action="{% url 'add_review' order.id %}" method="POST">
        {% csrf_token %}

        <div class="form-group" style="text-align: center;">
            <label style="font-size: 1.1rem; margin-bottom: 0.75rem;">Overall Rating *</label>
            <div style="display: flex; justify-content: center; gap: 1rem; font-size: 1.8rem; color: #cbd5e1;">
                {% for i in "12345" %}
                <label style="cursor: pointer;">
                    <input type="radio" name="rating" value="{{ i }}" {% if i == "5" %}checked{% endif %} style="display: none;" onchange="updateStars(this.value)">
                    <i class="fa-solid fa-star star-icon" data-value="{{ i }}" style="color: {% if i == '5' %}#ffa502{% else %}#cbd5e1{% endif %};"></i>
                </label>
                {% endfor %}
            </div>
        </div>

        <div class="form-group">
            <label for="comment">Your Review & Comments</label>
            <textarea id="comment" name="comment" class="form-control" rows="4" placeholder="Share your experience about food quality, taste, packaging, or delivery speed..." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.9rem;">
            Submit Rating & Review
        </button>
    </form>
</div>

<script>
function updateStars(rating) {
    const stars = document.querySelectorAll('.star-icon');
    stars.forEach(star => {
        const val = parseInt(star.getAttribute('data-value'));
        if (val <= parseInt(rating)) {
            star.style.color = '#ffa502';
        } else {
            star.style.color = '#cbd5e1';
        }
    });
}
</script>
{% endblock %}
